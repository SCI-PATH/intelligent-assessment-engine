# Page ranges use 1-based PDF viewer pages (not printed textbook folios),
# scoped to one file. Grades 7-9 ship as Part 1 + Part 2; each part has its
# own cover/ToC, so page 15 in part2 is not page 15 in part1.
#
# Single-file grades may use `pdf:`. Multi-file grades use `pdfs:` with
# stable ids. Every chapter in a multi-file grade must set `pdf_id`.
#
# To add / finish a grade:
#   1. Drop the PDF(s) at the paths below.
#   2. Fill `chapters` from each file's Table of Contents (1-based PDF pages).
#   3. Run: python -m scripts.extract_subconcepts --grade N
#   4. Hand-review src/iae/config/subconcepts.yaml
#   5. Run: python -m scripts.ingest_and_tag_chunks --grade N
grades:
  6:
    pdf: data/grade_6_science.pdf
    subject: Science
    chapters:
      - name: Wonders of the Living World
        page_start: 15
        page_end: 34
      - name: Things Around Us
        page_start: 35
        page_end: 48
      - name: Water as a Natural Resource
        page_start: 49
        page_end: 62
      - name: Energy in Day-to-Day Life
        page_start: 63
        page_end: 80
      - name: Light and Vision
        page_start: 81
        page_end: 100
      - name: Sound and Hearing
        page_start: 101
        page_end: 112
      - name: Magnets
        page_start: 113
        page_end: 123
      - name: Electricity for a Comfortable Life
        page_start: 124
        page_end: 146
      - name: Heat and Its Effects
        page_start: 147
        page_end: 161
      - name: Food-related Interactions
        page_start: 162
        page_end: 172
      - name: Weather and Climate
        page_start: 173
